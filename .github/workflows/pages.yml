name: Publicar demostración en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas antes de publicar
        run: npm install --no-audit --no-fund && npm test
        env:
          JWT_SECRET: ci-secreto-solo-para-pruebas-0123456789abcdef
      - name: Generar el sitio estático
        run: node scripts/build-pages.js
      - name: Publicar en la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demostración generada desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
